function getYtVideoId(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) {
      const id = u.pathname.slice(1).split("?")[0];
      if (id && id.length >= 8 && !id.includes("results")) return id;
    }
    const id = u.searchParams.get("v");
    if (id && id.length >= 8) return id;
  } catch (e) {}
  return null;
}

function ytEmbed(url) {
  const vid = getYtVideoId(url);
  return vid ? `https://www.youtube.com/embed/${vid}` : null;
}

function getYtThumbnail(url, defaultImg) {
  const vid = getYtVideoId(url);
  if (vid) {
    return `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
  }
  return defaultImg || "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80";
}

function getRecipeVideos(r) {
  if (r.videos && Array.isArray(r.videos) && r.videos.length >= 5) {
    return r.videos.slice(0, 5).map(v => ({
      id: v.video_id || getYtVideoId(v.url || v.video_url),
      title: v.title,
      channel: v.channel_name || v.channel || "Tamil Cooking",
      url: v.url || v.video_url,
      thumbnail: v.thumbnail_url || getYtThumbnail(v.url || v.video_url, r.image_url)
    }));
  }
  if (r.id && RECIPE_VIDEOS_MAP[r.id]) {
    return RECIPE_VIDEOS_MAP[r.id];
  }
  const t = (r.title || "").toLowerCase();
  if (t.includes("dosa")) return RECIPE_VIDEOS_MAP[2];
  if (t.includes("biryani")) return RECIPE_VIDEOS_MAP[3];
  if (t.includes("paneer")) return RECIPE_VIDEOS_MAP[4];
  if (t.includes("sambar")) return RECIPE_VIDEOS_MAP[5];
  if (t.includes("chettinad") || t.includes("chicken")) return RECIPE_VIDEOS_MAP[1];
  if (t.includes("koozh") || t.includes("millet")) return RECIPE_VIDEOS_MAP[6];
  return RECIPE_VIDEOS_MAP[1];
}

function getRecipeGallery(r) {
  if (r.id && RECIPE_GALLERY_MAP[r.id]) {
    return RECIPE_GALLERY_MAP[r.id];
  }
  const defaultImg = r.image_url || "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1200&q=80";
  return [
    { url: defaultImg, label: "Main Dish (உணவு)", caption: r.title || "Recipe Plating" }
  ];
}

function selectGalleryPhoto(url, caption, el) {
  const img = document.getElementById("mainShowcaseImg");
  const cap = document.getElementById("showcaseCaption");
  if (img) img.src = url;
  if (cap) cap.textContent = caption;
  document.querySelectorAll(".gallery-thumb-card").forEach(c => {
    c.classList.remove("active");
    c.style.borderColor = "var(--line)";
  });
  if (el) {
    el.classList.add("active");
    el.style.borderColor = "var(--primary)";
  }
}

function openPhotoModal(imgUrl, caption) {
  const currentImg = document.getElementById("mainShowcaseImg")?.src || imgUrl;

}

function openYouTubeLink(url) {
  if (url) {
    window.open(url, "_blank", "noopener,noreferrer");
  }
}

function slideCarousel(direction) {
  const total = currentCarouselVideos.length || 5;
  currentSlideIndex = (currentSlideIndex + direction + total) % total;
  updateCarouselState();
}

function goToSlide(index) {
  const total = currentCarouselVideos.length || 5;
  if (index >= 0 && index < total) {
    currentSlideIndex = index;
    updateCarouselState();
  }
}

function updateCarouselState() {
  const track = document.getElementById("carouselTrack");
  const viewport = document.getElementById("carouselViewport");
  const total = currentCarouselVideos.length || 5;

  if (track && viewport) {
    const cards = track.querySelectorAll(".yt-video-card");
    if (cards.length) {
      const cardWidth = cards[0].offsetWidth;
      const gap = 18;
      const maxScroll = Math.max(0, track.scrollWidth - viewport.clientWidth);
      const targetOffset = Math.min(currentSlideIndex * (cardWidth + gap), maxScroll);
      track.style.transform = `translateX(-${targetOffset}px)`;

      cards.forEach((c, idx) => {
        c.classList.toggle("active-slide", idx === currentSlideIndex);
      });
    }
  }

  // Update dots: ● for active, ○ for inactive
  for (let i = 0; i < total; i++) {
    const dot = document.getElementById("ytDot_" + i);
    if (dot) {
      const isActive = (i === currentSlideIndex);
      dot.classList.toggle("active", isActive);
      dot.textContent = isActive ? "●" : "○";
    }
  }

  // Update counters: 1 / 5, 2 / 5, 3 / 5, etc.
  const counterStr = `${currentSlideIndex + 1} / ${total}`;
  const badge = document.getElementById("carouselCounterBadge");
  const counterText = document.getElementById("carouselCounterText");
  if (badge) badge.textContent = counterStr;
  if (counterText) counterText.textContent = counterStr;
}

function initCarouselTouch() {
  const viewport = document.getElementById("carouselViewport");
  if (!viewport) return;

  let startX = 0;
  let startY = 0;

  viewport.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  }, { passive: true });

  viewport.addEventListener("touchend", (e) => {
    if (e.changedTouches.length === 1) {
      const deltaX = e.changedTouches[0].clientX - startX;
      const deltaY = e.changedTouches[0].clientY - startY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
        if (deltaX < 0) {
          slideCarousel(1); // Swipe left -> Next video
        } else {
          slideCarousel(-1); // Swipe right -> Previous video
        }
      }
    }
  }, { passive: true });

  window.addEventListener("resize", () => {
    updateCarouselState();
  });
}

function bilingual(en, ta) {
  return lang() === "ta" ? (ta || en) : en;
}

function scaleQuantity(qtyStr, baseServ, targetServ) {
  if (!qtyStr) return "";
  const num = parseFloat(qtyStr);
  if (isNaN(num)) return qtyStr;
  const scaled = (num / baseServ) * targetServ;
  return Number.isInteger(scaled) ? scaled.toString() : scaled.toFixed(1).replace(/\.0$/, "");
}

                  <span class="star-item active" onclick="setStar(2)">★</span>
                  <span class="star-item active" onclick="setStar(3)">★</span>
                  <span class="star-item active" onclick="setStar(4)">★</span>
                  <span class="star-item active" onclick="setStar(5)">★</span>
                </div>
              </div>
            </div>

            <label>Feedback Comment *
              <textarea id="reviewComment" rows="3" placeholder="How was the taste, spices, and cooking steps? Any modifications you made?" required></textarea>
            </label>

            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:10px">
              <button id="submitReviewBtn" type="submit" class="btn">🚀 Submit Feedback</button>
              <span id="reviewStatus" style="font-size:0.9rem;font-weight:700"></span>
            </div>
          </form>
        </div>
      </section>
    `;

    // Initialize interactive YouTube Carousel gestures and responsive sizing
    initCarouselTouch();
    setTimeout(updateCarouselState, 50);
  } catch (e) {
    app.innerHTML = `<div class="panel empty" style="color:var(--danger)"><h2>Error loading recipe</h2><p>${esc(e.message)}</p></div>`;
  }
}

async function saveFavorite(id) {
  if (getToken()) {
    try {
      await api("/users/me/favorites/" + id, { method: "POST" });
      alert("❤️ Recipe successfully saved to your CookShare favorites!");
      return;
    } catch (e) {
      if ((e.message || "").toLowerCase().includes("duplicate") || (e.message || "").toLowerCase().includes("already")) {
        alert("This recipe is already in your favorites!");
        return;
      }
    }
  }
  let localFavs = JSON.parse(localStorage.getItem("cookshare_favs") || "[]");
  if (!localFavs.includes(id)) {
    localFavs.push(id);
    localStorage.setItem("cookshare_favs", JSON.stringify(localFavs));
    alert("❤️ Saved to your Favorites!");
  } else {
    alert("This recipe is already in your saved favorites!");
  }
}

async function submitReview(e, id) {
  e.preventDefault();
  const nameInput = document.getElementById("reviewerName");
  const commentInput = document.getElementById("reviewComment");
  const statusSpan = document.getElementById("reviewStatus");
  const submitBtn = document.getElementById("submitReviewBtn");

  const name = nameInput.value.trim() || "Food Enthusiast";
  const comment = commentInput.value.trim();

  if (!comment) {
    alert("Please enter a comment for your feedback.");
    return;
  }

  submitBtn.disabled = true;
  statusSpan.style.color = "var(--primary)";
  statusSpan.textContent = "Submitting feedback...";

  try {
    const data = await api("/recipes/" + id + "/reviews", {
      method: "POST",
      body: JSON.stringify({
        rating: selectedRating,
        comment,
        name
      })
    });

    statusSpan.style.color = "var(--success)";
    statusSpan.textContent = "✅ Feedback submitted successfully!";

    // Prepend the new review into the list without page reload
    const reviewsBox = document.getElementById("reviewsList");
    const noReviewsNotice = document.getElementById("noReviewsNotice");
    if (noReviewsNotice) noReviewsNotice.remove();

    const newCardHtml = renderReviewCard({
      name,
      rating: selectedRating,
      comment,
      created_at: new Date().toISOString()
    });

    reviewsBox.insertAdjacentHTML("afterbegin", newCardHtml);

    // Update count and avg rating
    if (data.totalReviews) {
      document.getElementById("reviewCountNum").textContent = data.totalReviews;
    }
    if (data.avgRating) {
      document.getElementById("badgeAvgRating").textContent = `⭐ ${data.avgRating} / 5.0`;
      document.getElementById("topRatingBox").textContent = `⭐ ${data.avgRating}`;
    }

    // Reset comment field
    commentInput.value = "";
    setTimeout(() => {
      statusSpan.textContent = "";
      submitBtn.disabled = false;
    }, 3000);
  } catch (err) {
    statusSpan.style.color = "var(--danger)";
    statusSpan.textContent = "Error: " + err.message;
    submitBtn.disabled = false;
  }
}

async function addRecipeIngredients(id) {
  if (!currentRecipe || !currentRecipe.ingredients || !currentRecipe.ingredients.length) {
    showToast("No ingredients found in this recipe", "error");
    return;
  }

  const dishTitle = bilingual(currentRecipe.title, currentRecipe.title_ta);
  const items = currentRecipe.ingredients.map(i => {
    const scaledQty = scaleQuantity(i.quantity, baseServings, currentServings);
    return {
      name: bilingual(i.name, i.name_ta),
      quantity: scaledQty,
      unit: lang() === "ta" ? (i.unit_ta || i.unit || "") : (i.unit || ""),
      category: dishTitle,
      dish_name: dishTitle
    };
  });

  const res = await addItemsToShoppingList(items, dishTitle);
  if (res.success) {
    showToast(
      lang() === "ta"
        ? `🛒 ${items.length} பொருட்கள் உங்கள் ஷாப்பிங் பட்டியலில் சேர்க்கப்பட்டன!`
        : `🛒 Added ${items.length} ingredients from "${dishTitle}" to your Shopping List!`,
      "success",
      { text: lang() === "ta" ? `"${dishTitle}" மெனு பார்க்க ➔` : `View "${dishTitle}" Menu ➔`, url: `shopping.html?dish=${encodeURIComponent(dishTitle)}` }
    );
  }
}

function shareRecipe(t) {
  const shareTitle = decodeURIComponent(t);
  const shareUrl = location.href;
  if (navigator.share) {
    navigator.share({ title: shareTitle, text: `Check out ${shareTitle} recipe on CookShare:`, url: shareUrl }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(shareUrl).then(() => {
      alert("📋 Recipe link copied to clipboard!\n" + shareUrl);
    });
  } else {
    prompt("Copy recipe link:", shareUrl);
  }
}
