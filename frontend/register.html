<!doctype html>
<html><head><meta charset="UTF-8"><title>Register | CookShare</title><link rel="stylesheet" href="css/style.css"></head>
<body><header></header>
<main>
<div class="panel" style="max-width:520px;margin:80px auto">
<h1>Create Account</h1>
<form id="registerForm">
<label>Name<input id="name" required></label>
<label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" minlength="8" required></label>
<button class="btn">Register</button>
</form>
<p id="message"></p>
<a href="login.html">Already have an account?</a>
</div>
</main>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
registerForm.onsubmit=async e=>{
 e.preventDefault();
 try{
  const data=await api("/auth/register",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:password.value})});
  saveAuth(data); location.href="/";
 }catch(err){message.textContent=err.message}
};
</script>
</body></html>
